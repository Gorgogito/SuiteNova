[package]
name = "suitenova"
version = "0.0.16"
description = "SuiteNova – suite ofimática libre"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "suitenova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# correo: IMAP y SMTP con TLS del sistema (SChannel en Windows, Security.framework en macOS, OpenSSL en Linux)
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls"] }
base64 = "0.22"
# OAuth 2.0 (PKCE con redirección a este equipo) y los protocolos JMAP y Exchange (HTTP con el TLS del sistema)
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.10"
getrandom = "0.2"
webbrowser = "1"
quick-xml = "0.37"
# Nova Forms: recoger respuestas por la red local (direcciones de este equipo y lectura de las peticiones)
if-addrs = "0.15"
httparse = "1"

# contraseñas en el almacén seguro del sistema
[target.'cfg(windows)'.dependencies]
# recorte de pantalla nativo (solo Windows por ahora: en los demás sistemas se usa el selector del navegador)
xcap = "0.9.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["windows-native"] }
# avisos de Windows (notificaciones) y el registro del nombre con el que se muestran
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
windows-registry = "0.6"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# la codificación de imágenes es muy lenta sin optimizar (una captura de 2560×1440 tardaba 2,4 s en el perfil de desarrollo)
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.xcap]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
